<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Navy Base & Vignette Gradient -->
    <radialGradient id="bgGlow" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#111c38" />
      <stop offset="55%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#060a14" />
    </radialGradient>
    <radialGradient id="accentGlow" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="85%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Pillar Gradients -->
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="p5Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', 'Roboto Mono', Consolas, Monaco, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#accentGlow)" />
  <rect width="1200" height="630" fill="url(#purpleGlow)" />

  <!-- Subtle Precision Engineering Grid Lines -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="1120" y1="0" x2="1120" y2="630" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="550" x2="1200" y2="550" />
    <!-- Center horizontal datum -->
    <line x1="80" y1="365" x2="1120" y2="365" stroke-dasharray="4 8" />
  </g>

  <!-- Precision Corner Coordinate Markers -->
  <g opacity="0.4" stroke="#3b82f6" stroke-width="1.5" fill="none">
    <path d="M 80 96 L 80 80 L 96 80" />
    <path d="M 1104 80 L 1120 80 L 1120 96" />
    <path d="M 80 534 L 80 550 L 96 550" />
    <path d="M 1104 550 L 1120 550 L 1120 534" />
  </g>

  <!-- TOP HEADER / BRAND IDENTITY -->
  <g transform="translate(100, 85)">
    <!-- Brand Mark (Hexagonal Systems Node) -->
    <g transform="translate(0, 0)">
      <polygon points="18,3 33,12 33,30 18,39 3,30 3,12" fill="none" stroke="#2563eb" stroke-width="2.5" />
      <circle cx="18" cy="21" r="5" fill="#3b82f6" />
      <line x1="18" y1="3" x2="18" y2="16" stroke="#60a5fa" stroke-width="2" />
      <line x1="3" y1="30" x2="14" y2="23" stroke="#60a5fa" stroke-width="2" />
      <line x1="33" y1="30" x2="22" y2="23" stroke="#60a5fa" stroke-width="2" />
    </g>

    <!-- Platform Name -->
    <text x="50" y="28" class="font-sans" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">
      BUILD YOUR BUSINESS
    </text>

    <!-- Systems Taxonomy Tag -->
    <rect x="800" y="3" width="220" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="818" cy="20" r="4" fill="#10b981" />
    <text x="832" y="24" class="font-mono" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.08em">
      SYSTEMS &amp; PLAYBOOKS
    </text>
  </g>

  <!-- EDITORIAL HERO STATEMENT -->
  <g transform="translate(100, 180)">
    <!-- Super-title Tagline -->
    <text x="0" y="0" class="font-mono" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="0.18em">
      A PRACTICAL BUSINESS ARCHITECTURE
    </text>

    <!-- Main Editorial Title -->
    <text x="0" y="46" class="font-sans" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">
      From First Idea to Scalable Enterprise.
    </text>

    <!-- Subtitle / Methodology Value Proposition -->
    <text x="0" y="86" class="font-sans" font-size="20" font-weight="400" fill="#94a3b8" letter-spacing="-0.01em">
      Structured engineering principles, empirical validation, and actionable execution playbooks.
    </text>
  </g>

  <!-- FIVE-PILLAR INTERCONNECTED METHODOLOGY CARDS -->
  <!-- Pipeline flow axis across 1000px (100 to 1100). 5 cards, width: 184px each, gap: 20px -->
  <g transform="translate(100, 310)">

    <!-- Process Flow Connecting Vector Line Behind Cards -->
    <line x1="92" y1="65" x2="908" y2="65" stroke="#1e293b" stroke-width="3" />
    <line x1="92" y1="65" x2="908" y2="65" stroke="#334155" stroke-width="1" stroke-dasharray="6 6" />

    <!-- Flow Direction Arrows between cards -->
    <g fill="#475569">
      <!-- Gap 1: 184 to 204 (center: 194) -->
      <polygon points="191,61 197,65 191,69" />
      <!-- Gap 2: 388 to 408 (center: 398) -->
      <polygon points="395,61 401,65 395,69" />
      <!-- Gap 3: 592 to 612 (center: 602) -->
      <polygon points="599,61 605,65 599,69" />
      <!-- Gap 4: 796 to 816 (center: 806) -->
      <polygon points="803,61 809,65 803,69" />
    </g>

    <!-- PILLAR 01: UNDERSTAND (Foundation) -->
    <g transform="translate(0, 0)">
      <rect width="184" height="142" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <rect width="184" height="142" rx="12" fill="url(#p1Grad)" />
      <!-- Accent Top Border -->
      <rect x="16" y="0" width="40" height="3" rx="1.5" fill="#3b82f6" />
      
      <!-- Number & Tag -->
      <text x="16" y="28" class="font-mono" font-size="11" font-weight="700" fill="#60a5fa" letter-spacing="0.1em">01 · STAGE</text>
      <!-- Concept Verb (Primary Action) -->
      <text x="16" y="58" class="font-sans" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">UNDERSTAND</text>
      <!-- Pillar Name -->
      <text x="16" y="80" class="font-sans" font-size="13" font-weight="600" fill="#94a3b8">Foundation</text>
      <!-- Pillar Milestone -->
      <rect x="16" y="100" width="152" height="24" rx="6" fill="#1e293b" />
      <text x="24" y="116" class="font-mono" font-size="10" font-weight="500" fill="#cbd5e1">Core Fundamentals</text>
    </g>

    <!-- PILLAR 02: VALIDATE (Validation) -->
    <g transform="translate(204, 0)">
      <rect width="184" height="142" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <rect width="184" height="142" rx="12" fill="url(#p2Grad)" />
      <rect x="16" y="0" width="40" height="3" rx="1.5" fill="#06b6d4" />
      
      <text x="16" y="28" class="font-mono" font-size="11" font-weight="700" fill="#22d3ee" letter-spacing="0.1em">02 · STAGE</text>
      <text x="16" y="58" class="font-sans" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">VALIDATE</text>
      <text x="16" y="80" class="font-sans" font-size="13" font-weight="600" fill="#94a3b8">Starting Lean</text>
      <rect x="16" y="100" width="152" height="24" rx="6" fill="#1e293b" />
      <text x="24" y="116" class="font-mono" font-size="10" font-weight="500" fill="#cbd5e1">Customer Evidence</text>
    </g>

    <!-- PILLAR 03: EARN (Revenue) -->
    <g transform="translate(408, 0)">
      <rect width="184" height="142" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <rect width="184" height="142" rx="12" fill="url(#p3Grad)" />
      <rect x="16" y="0" width="40" height="3" rx="1.5" fill="#10b981" />
      
      <text x="16" y="28" class="font-mono" font-size="11" font-weight="700" fill="#34d399" letter-spacing="0.1em">03 · STAGE</text>
      <text x="16" y="58" class="font-sans" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">EARN</text>
      <text x="16" y="80" class="font-sans" font-size="13" font-weight="600" fill="#94a3b8">Revenue Engine</text>
      <rect x="16" y="100" width="152" height="24" rx="6" fill="#1e293b" />
      <text x="24" y="116" class="font-mono" font-size="10" font-weight="500" fill="#cbd5e1">Cash Flow &amp; Margin</text>
    </g>

    <!-- PILLAR 04: OPERATE (Operations) -->
    <g transform="translate(612, 0)">
      <rect width="184" height="142" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <rect width="184" height="142" rx="12" fill="url(#p4Grad)" />
      <rect x="16" y="0" width="40" height="3" rx="1.5" fill="#8b5cf6" />
      
      <text x="16" y="28" class="font-mono" font-size="11" font-weight="700" fill="#a78bfa" letter-spacing="0.1em">04 · STAGE</text>
      <text x="16" y="58" class="font-sans" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">OPERATE</text>
      <text x="16" y="80" class="font-sans" font-size="13" font-weight="600" fill="#94a3b8">Systems &amp; Ops</text>
      <rect x="16" y="100" width="152" height="24" rx="6" fill="#1e293b" />
      <text x="24" y="116" class="font-mono" font-size="10" font-weight="500" fill="#cbd5e1">Repeatable Workflows</text>
    </g>

    <!-- PILLAR 05: SCALE (Scaling) -->
    <g transform="translate(816, 0)">
      <rect width="184" height="142" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <rect width="184" height="142" rx="12" fill="url(#p5Grad)" />
      <rect x="16" y="0" width="40" height="3" rx="1.5" fill="#f59e0b" />
      
      <text x="16" y="28" class="font-mono" font-size="11" font-weight="700" fill="#fbbf24" letter-spacing="0.1em">05 · STAGE</text>
      <text x="16" y="58" class="font-sans" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">SCALE</text>
      <text x="16" y="80" class="font-sans" font-size="13" font-weight="600" fill="#94a3b8">Growing a Business</text>
      <rect x="16" y="100" width="152" height="24" rx="6" fill="#1e293b" />
      <text x="24" y="116" class="font-mono" font-size="10" font-weight="500" fill="#cbd5e1">Compounding Growth</text>
    </g>
  </g>

  <!-- BOTTOM FOOTER / DOMAIN CREDENTIALS -->
  <g transform="translate(100, 510)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#1e293b" stroke-width="1" />
    
    <!-- URL domain -->
    <text x="0" y="32" class="font-mono" font-size="14" font-weight="600" fill="#64748b" letter-spacing="0.04em">
      build-your-business.pages.dev
    </text>

    <!-- Methodology badge right (Neutral & accurate) -->
    <text x="1000" y="32" text-anchor="end" class="font-mono" font-size="12" font-weight="500" fill="#475569" letter-spacing="0.06em">
      FIVE-PILLAR BUSINESS FRAMEWORK
    </text>
  </g>
</svg>